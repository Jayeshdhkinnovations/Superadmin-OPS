server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The base image ships with `gzip on` commented out, so the console
    # bundle was going over the wire uncompressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;

    # Vite fingerprints every asset filename, so a changed file is always a
    # new URL - the old one can be cached permanently.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # API calls (from the browser, same-origin) get forwarded internally to
    # the backend process running in this same container. proxy_pass has no
    # path here on purpose, so the full original /app/... URI is passed
    # through unchanged - the backend already expects that exact prefix.
    location ~ ^/app(/|$) {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing - any other path serves index.html so client-side routing
    # (react-router) handles it, instead of Nginx 404ing on a page refresh.
    # index.html must never be cached: it is the only file naming the current
    # asset hashes, so a stale copy would point browsers at old bundles.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
